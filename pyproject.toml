[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiyo-engineering-os"
version = "0.2.0"
description = "Industry-adaptive AI automation with local device execution and cloud coordination"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
cloud = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "google-auth>=2.35,<3", "requests>=2.32,<3", "CacheControl>=0.14,<1", "cryptography>=44,<47"]
device = ["cryptography>=44,<47", "keyring>=25,<26"]

[project.scripts]
hiyo = "engineering_os.cli:main"
hiyo-agent = "device_agent.agent:main"

[tool.setuptools.packages.find]
include = ["engineering_os*", "hiyo_cloud*", "device_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
engineering_os = ["catalog.json"]
