[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiyo-engineering-os"
version = "0.1.0"
description = "Private, Windows-first Codex engineering controller"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
hiyo = "engineering_os.cli:main"

[tool.setuptools.packages.find]
include = ["engineering_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
